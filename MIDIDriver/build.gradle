plugins {
    id 'com.android.library'
    id 'maven-publish'
}

version = '0.2.0-kitaharalab'

//println("MIDIDriver build.gradle")
//println(rootProject.name)
//println("${project(':javax.sound.midi').getBuildDir()}${File.separator}outputs${File.separator}aar${File.separator}javax.sound.midi-release.aar")



android {
    compileSdkVersion 30

    defaultConfig {
        minSdkVersion 27
        targetSdkVersion 30
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }

        // Move the tests to tests/java, tests/res, etc...
        //instrumentTest.setRoot('tests')

        // Move the build types to build-types/<type>
        // For instance, build-types/debug/java, build-types/debug/AndroidManifest.xml, ...
        // This moves them out of them default location under src/<type>/... which would
        // conflict with src/ being used by the main source set.
        // Adding new build types or product flavors should be accompanied
        // by a similar customization.
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }
    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

    repositories{
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/kitaharalab/javax.sound.midi-for-Android")
            credentials {
                username = project.findProperty("ext.user") ?: System.getenv("GITHUB_ACTOR")
                password =  project.findProperty("ext.token") ?: System.getenv("GITHUB_TOKEN")
            }
            // url "https://raw.github.com/kitaharalab/javax.sound.midi-for-Android/repository/"
        }
    }

}

dependencies {
    implementation 'androidx.annotation:annotation:1.3.0'
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'javax.sound.midi-for-Android:javax.sound.midi-release:0.2.0-kitaharalab'
}

afterEvaluate {
    publishing {
        repositories {
            maven {
                name = "GitHubPackages"
                url = "https://maven.pkg.github.com/kitaharalab/USB-MIDI-Driver"
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = "${artifactId.toLowerCase()}-release"
            }
            debug(MavenPublication) {
                from components.debug
                artifactId = "${artifactId.toLowerCase()}-debug"
            }
        }
    }
}

task comps {
    afterEvaluate {
        println("Components: " + components.names)
    }
}


