name: Build javax.sound.midi-for-Android CI

on: [push, workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: 11
    - run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew -p MIDIDriver build
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v1
      with:
        name: MIDIDriver
        path: MIDIDriver/build/outputs/aar/